<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub2gether — Hero vidéo au scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a1f17; }

/* Menu démo (reste au-dessus de la vidéo) */
.top-nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 30;
  padding: 18px 30px;
  font-family: 'DM Sans', sans-serif;
  color: #fff;
  display: flex;
  justify-content: space-between;
  backdrop-filter: blur(8px);
  background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.08));
}

/* HERO VIDEO SCRUB */
.hero-video {
  position: relative;
  min-height: 320vh;
  background: #000;
}
.hero-sticky {
  position: sticky;
  top: 0;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}
.hero-media {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(.55) saturate(1.1);
  will-change: transform;
  transform: translateZ(0);
}

.hero-overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 120px 24px 40px;
  color: #fff;
  pointer-events: none;
}
.hero-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: clamp(34px, 7vw, 86px);
  line-height: 1.03;
  letter-spacing: -2px;
  max-width: 900px;
}
.hero-title em { color: #7FE3BF; font-style: normal; }
.hero-sub {
  margin-top: 20px;
  font-family: 'DM Sans', sans-serif;
  font-size: clamp(15px, 2vw, 20px);
  color: rgba(255,255,255,.88);
}

.fake-after {
  height: 80vh;
  background: #162820;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Sans', sans-serif;
  font-size: 16px; color: rgba(255,255,255,.45);
}
</style>
</head>
<body>

<header class="top-nav">
  <strong>Hub2gether</strong>
  <span>Menu</span>
</header>

<section class="hero-video" id="hero-video">
  <div class="hero-sticky">
    <video
      id="hero-media"
      class="hero-media"
      muted
      playsinline
      preload="metadata"
      poster="Actifs/hero-scroll-poster.jpg"
    >
      <!-- Remplacez le fichier ci-dessous par VOTRE vidéo -->
      <!-- Nom du fichier à publier : hero-scroll-video.mp4 -->
      <source src="Actifs/hero-scroll-video.mp4" type="video/mp4">
      Votre navigateur ne prend pas en charge la vidéo HTML5.
    </video>

    <div class="hero-overlay">
      <div>
        <h1 class="hero-title">Une landing qui <em>vit</em> avec le scroll.</h1>
        <p class="hero-sub">La vidéo occupe tout l'écran, passe sous le menu, et se déroule pendant le défilement.</p>
      </div>
    </div>
  </div>
</section>

<div class="fake-after">Section suivante — Placez votre vidéo dans <code>Actifs/hero-scroll-video.mp4</code></div>

<script>
(function () {
  var section = document.getElementById('hero-video');
  var video = document.getElementById('hero-media');
  if (!section || !video) return;

  var duration = 0;
  var ready = false;
  var rafId = null;

  function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

  function syncVideoWithScroll() {
    rafId = null;
    if (!ready || duration <= 0) return;

    var rect = section.getBoundingClientRect();
    var total = section.offsetHeight - window.innerHeight;
    if (total <= 0) return;

    var scrolled = clamp(-rect.top, 0, total);
    var progress = scrolled / total;
    var targetTime = progress * duration;

    if (Math.abs(video.currentTime - targetTime) > 0.004) {
      video.currentTime = targetTime;
    }
  }

  function scheduleSync() {
    if (rafId !== null) return;
    rafId = requestAnimationFrame(syncVideoWithScroll);
  }

  video.addEventListener('loadedmetadata', function () {
    duration = video.duration || 0;
    ready = duration > 0;
    syncVideoWithScroll();
  });

  video.addEventListener('loadeddata', function () {
    video.pause();
  });

  window.addEventListener('scroll', scheduleSync, { passive: true });
  window.addEventListener('resize', syncVideoWithScroll, { passive: true });
})();
</script>

</body>
</html>
